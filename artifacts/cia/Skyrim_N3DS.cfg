# Skyrim N3DS device runtime settings (96x24 CIA profile)
# Place this file at: sdmc:/Skyrim_N3DS.cfg
# Read once at launch, before graphics/memory setup. Unknown keys are ignored
# and logged as "[cfg] ... ignored". No rebuild is needed to change a value.

N3DS_TEX_GPU_LIMIT=6M
N3DS_TEX_GUEST_LIMIT=16M
N3DS_VRAM_LIMIT=6M
N3DS_TARGET_VRAM_LIMIT=4352K
N3DS_TEXT_WINDOW_MB=5
N3DS_STREAM=0

# Optional overrides (uncomment to use):
# N3DS_IRC_PATH=sdmc:/Skyrim/ir/tesv.irc
# N3DS_IRC_CACHE_BYTES=4194304
# N3DS_MEM_EVERY=300
#
# Compressed guest swap is on by default on the device:
#   budget 32 MiB, resident target 32 MiB.
# N3DS_SWAP=1
# N3DS_SWAP_BUDGET_MB=32
# N3DS_GUEST_TARGET_MB=32
#
# Measurement only: reports a fictional 512 MiB commit limit.
# Never enable for a normal run.
# TESV_MEMPROBE=1
